<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>화살표 함수</title>
</head>
<body>
    <script>

        function times3(x) {

            return 3*x ;

        }

        console.log  (times3(10));

// 4의 배수  만드는 함수 (화살표 함수)

        // let times4 = function(x){
        //     return 4*x ;
        // }

        let times5 = (x) => {
             return 5*x ;
        }


        console.log  (times5(100));



        let total = ( x, y) => {
                return x +y ;
        }
        console.log (total( 10  , 50));
        
        let message = () => {
            return "행운을 빌어요!!";
        }
        console.log (message());
        </script>
</body>

</html>
