<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>변수와 자료형</title>
</head>
<body>
    <h2>변수와 자료형</h2>
    <script>
        // 변수 선언  - 자료형 표기는 var , let 
        var name = "Alice";
        var age = 30;
        let isStudent = false;
        // 출력
        console.log("Name:" ,name);
        console.log("Age:" ,age);
        console.log("Is Studunet:" ,isStudent);

        //호이스팅
        
      
        // 상수선언
        const z = 20;

        //z = 50;
        console.log("z:" ,z);

    </script>
</body>
</html>
