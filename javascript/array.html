<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배열 에제</title>
</head>
<body>
    <h2>배열(Array)</h2>
    
    <script>
        let season ="여름" ;
        console.log("계절:" , season);

        console.log("계절 타입:" , typeof(season));

        let seasons =  ["봄" ,"여름", "가을" ,"겨울"  ] ;

        console.log("계절s:" , seasons);

        console.log("계절s 타입:" , typeof(seasons));

        //요소에 접근 (조회)

        console.log("계절s 0:" , seasons[0]);
        console.log("계절s 2:" , seasons[2]);

        let numbers = new Array(4);

        console.log("배열의 길이:  " ,numbers.length);

        numbers[0]  =10;
        numbers[1]  =20;
        numbers[2]  =30;
        numbers[3]  =40;

        console.log(numbers);

    </script>
</body>
</html>
