<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>객체의 정의와 사용</title>
</head>
<body>
   <h2>객체 </h2>
   <script>
    let person = {
        name : "이정후",
        age  : 27,
        play: function(){
            //return this.name+ "가 야구를 합니다."
            return `${this.name} 가 야규를 합니다.`;
        }
    }

    console.log(person);
    console.log(typeof(person));

    console.log("이름: " , person.name);
    console.log("나이: " , person.age);
    console.log("활동: " , person.play());

   </script> 
</body>
</html>
