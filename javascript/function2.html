<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>반환값이 있는 함수</title>
</head>
<body>
    <h2>
        Funcion - return 
    </h2>
    <div id="demo"></div>
    <button onclick="message()"> 확인</button>
    <script> 
        
        //메세지 출력
        let demo = document.getElementById("demo");

        function message() {
            return demo.innerHTML = "<h1>Good Luck!</h1>"
        } 

        //console.log(message());
    
    </script>

</body>
</html>
